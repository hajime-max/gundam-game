<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081726"><link rel="manifest" href="manifest.webmanifest"><title>ゲームをスマホに保存</title><style>body{font:16px sans-serif;background:#081726;color:#e0eeee;max-width:620px;margin:40px auto;padding:20px;line-height:1.8}button,a{display:inline-block;padding:14px;background:#a7ece0;color:#071726;border:0;border-radius:7px;font-size:16px;text-decoration:none}progress{width:100%}small{color:#aac4cb}</style><h1>ゲームをスマホに保存</h1><p>第1〜第4ステージの画像・音声をまとめて保存します。保存中はこの画面を開いたままにしてください。</p><button id="save">保存・最新版へ更新</button><p id="status" role="status">最初の保存にはインターネット接続が必要です。</p><progress id="progress" value="0" max="1"></progress><p><a href="index.html">ゲームを開く</a></p><p>保存が完了したら、ブラウザーのメニューから「ホーム画面に追加」を選んでください。iPhoneはSafariの共有メニューから追加します。</p><small>ブラウザーのデータ削除や端末の容量整理で消える場合があります。その際は再保存してください。</small><script>
let worker;const status=document.getElementById('status'),save=document.getElementById('save'),progress=document.getElementById('progress');
navigator.serviceWorker?.addEventListener('message',e=>{if(e.data.type==='progress'){progress.max=e.data.total;progress.value=e.data.done;status.textContent='保存中 '+e.data.done+' / '+e.data.total;}if(e.data.type==='complete'){status.textContent='保存完了。オフラインで遊べます。ホーム画面へ追加した後、そのアイコンから一度起動してください。';save.disabled=false;}if(e.data.type==='error'){status.textContent='保存が完了していません。ネット接続を確認してもう一度押してください。';save.disabled=false;}});
save.onclick=async()=>{save.disabled=true;try{if(!isSecureContext||!navigator.serviceWorker)throw Error();const reg=await navigator.serviceWorker.register('./sw.js');await reg.update();await navigator.serviceWorker.ready;worker=reg.installing||reg.waiting||reg.active;if(worker.state==='installing')await new Promise((resolve,reject)=>worker.addEventListener('statechange',()=>{if(worker.state==='installed')resolve();if(worker.state==='redundant')reject(Error());}));worker.postMessage({type:'download'});}catch{status.textContent='保存できません。HTTPSの公開URLで、ネット接続中に試してください。';save.disabled=false;}};
</script></html>
