<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081726"><link rel="manifest" href="manifest.webmanifest"><title>ゲームをスマホに保存</title><style>body{font:16px sans-serif;background:#081726;color:#e0eeee;max-width:620px;margin:40px auto;padding:20px;line-height:1.8}button,a{display:inline-block;padding:14px;background:#a7ece0;color:#071726;border:0;border-radius:7px;font-size:16px;text-decoration:none}progress{width:100%}small{color:#aac4cb}</style><h1>ゲームをスマホに保存</h1><p>第1〜第4ステージの画像・音声（約162 MB）を保存します。保存中はこの画面を開いたままにしてください。</p><button id="save">保存・最新版へ更新</button><p id="status" role="status">最初の保存にはインターネット接続が必要です。</p><progress id="progress" value="0" max="1"></progress><p><a href="index.html">ゲームを開く</a></p><p>保存が完了したら、ブラウザーのメニューから「ホーム画面に追加」を選んでください。iPhoneはSafariの共有メニューから追加します。</p><small>ブラウザーのデータ削除や端末の容量整理で消える場合があります。その際は再保存してください。</small><script>
const status=document.getElementById('status');
const save=document.getElementById('save');
const progress=document.getElementById('progress');
const scope=new URL('./',location.href);
function report(done,total){
 progress.max=total;
 progress.value=done;
 status.textContent='保存中 '+done+' / '+total;
}
async function saveFile(cache,file){
 const url=new URL(file,scope);
 let error;
 for(let attempt=0;attempt<3;attempt++){
  try{
   const response=await fetch(url,{cache:'reload'});
   if(!response.ok)throw Error('HTTP '+response.status);
   await cache.put(url,response);
   return;
  }catch(problem){
   if(problem.name==='QuotaExceededError')throw problem;
   error=problem;
   if(attempt<2)await new Promise(resolve=>setTimeout(resolve,700*(attempt+1)));
  }
 }
 throw Error(file+' ('+error.message+')');
}
save.onclick=async()=>{
 save.disabled=true;
 status.textContent='保存の準備中…';
 try{
  const registration=await navigator.serviceWorker.register('./sw.js');
  await registration.update();
  const response=await fetch('./offline-assets.json',{cache:'no-store'});
  if(!response.ok)throw Error('保存用ファイル一覧 HTTP '+response.status);
  const {version,files}=await response.json();
  const cache=await caches.open('gundam-'+scope.href+version);
  let done=0;
  report(done,files.length);
  for(const file of files){
   const url=new URL(file,scope);
   if(file==='install.html'||!(await cache.match(url)))await saveFile(cache,file);
   report(++done,files.length);
  }
  await cache.put(scope,await cache.match(new URL('index.html',scope)));
  status.textContent='保存完了。オフラインで遊べます。';
 }catch(error){
  status.textContent=error.name==='QuotaExceededError'
   ?'端末の保存領域が不足しています。空き容量を増やしてから再開してください。'
   :'保存が中断されました。もう一度押すと続きから再開します。 '+error.message;
 }finally{
  save.disabled=false;
 }
};
</script></html>
